<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css" type="text/css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div class="game_board">
            <h1 class="game_title">Rock Paper Scissors</h1>

            <div class="score_row">
                    <div class="score_area player">
                        placeholder player
                    </div>

                    <div class="score_area bot">
                        placeholder bot
                    </div>
            </div>

            <div class="choice_row">
                <div class="choice_area player">
                    <!--choose a more appropriate tag-->
                    <button class="choice_item">rock</button>
                    <button class="choice_item">paper</button>
                    <button class="choice_item">scissors</button>
                </div>

                <div class="choice_area bot">
                    <!--choose a more appropriate tag-->
                    <button class="choice_item">rock</button>
                    <button class="choice_item">paper</button>
                    <button class="choice_item">scissors</button>
                </div>
            </div>

        </div>
        <script src="main.js"></script>
    </body>
</html>
